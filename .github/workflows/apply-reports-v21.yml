name: Apply Reports V21

on:
  push:
    paths:
      - '.github/workflows/apply-reports-v21.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted reports patch
        run: python scripts/apply_reports_v21.py
      - name: Commit targeted changes
        run: |
          git config user.name "CALI RH"
          git config user.email "patricia@calirh.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(reports): add manual complements and document readability"
          git push
