name: Apply Reports V22 Capacity Notice

on:
  push:
    paths:
      - '.github/workflows/apply-reports-v22-capacity-notice.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted report patch
        run: python scripts/apply_reports_v22_capacity_notice.py
      - name: Commit targeted changes
        run: |
          rm -f scripts/apply_reports_v22_capacity_notice.py .github/workflows/apply-reports-v22-capacity-notice.yml
          git config user.name "CALI RH"
          git config user.email "patricia@calirh.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(reports): show first capacity warning in document"
          git push
